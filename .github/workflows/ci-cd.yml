name: CI / CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  IMAGE_NAME: poc-cloud-native-dev

jobs:

  # ─────────────────────────────────────────────
  # JOB 1 — build & test
  # ─────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ./POC-Cloud-native-dev

      - name: Build
        run: dotnet build --no-restore -c Release
        working-directory: ./POC-Cloud-native-dev

  # ─────────────────────────────────────────────
  # JOB 2 — docker build & push
  # ─────────────────────────────────────────────
  docker:
    name: Docker Build & Run
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t poc-local ./POC-Cloud-native-dev

      - name: Run container
        run: |
          docker run -d -p 8080:8080 --name poc-test poc-local
          sleep 5

      - name: Test container is running
        run: |
          curl -f http://localhost:8080/weatherforecast || exit 1

      - name: Stop container
        run: docker stop poc-test